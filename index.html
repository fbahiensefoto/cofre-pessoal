<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      // Decide o tema ANTES da primeira pintura da página, direto no HTML —
      // se isso rodasse só depois do React montar (como era antes), existe
      // uma janela onde a página pinta no tema claro (o :root sem atributo
      // nenhum) e só troca pro escuro alguns instantes depois. Tem que usar
      // exatamente a mesma chave e a mesma regra de padrão do useTheme.ts.
      (function () {
        function aplicarMetaParaEscuro(escuro) {
          var cor = document.querySelector('meta[name="theme-color"]');
          if (cor) cor.setAttribute('content', escuro ? '#0C0C0D' : '#F1F1EF');
          var barra = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (barra) barra.setAttribute('content', escuro ? 'black' : 'default');
        }
        try {
          var tema = localStorage.getItem('cofre-pessoal-theme');
          if (tema !== 'light' && tema !== 'dark' && tema !== 'auto') {
            tema = 'dark';
          }
          if (tema !== 'auto') {
            document.documentElement.setAttribute('data-theme', tema);
          }
          var escuroResolvido =
            tema === 'auto'
              ? typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches
              : tema === 'dark';
          aplicarMetaParaEscuro(escuroResolvido);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          aplicarMetaParaEscuro(true);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Cofre Pessoal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
